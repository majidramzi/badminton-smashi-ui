<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Smashi Login — design draft</title><link rel="stylesheet" href="./auth-preview.css"><svg class="bands" viewBox="0 0 400 800" preserveAspectRatio="none" aria-hidden="true"><path fill="#14B8A6" opacity=".19" d="M0 0H190C98 39 44 99 0 183Z"/><path fill="#066B6E" opacity=".38" d="M400 316V575C289 654 158 737 0 798C137 711 277 476 400 316Z"/><path fill="#14B8A6" opacity=".25" d="M400 600V800H40C228 774 314 700 400 600Z"/></svg><main><header><img src="../assets/brand/owner-reference/Smashi-logo.png" alt=""><h1>Smashi</h1><p class="tag">PLAY <b>•</b> CONNECT <b>•</b> GROW</p></header><form id="login"><label class="field"><span class="demo-icon" data-icon="email" aria-hidden="true"></span><input type="email" placeholder="Email" aria-label="Email"></label><div class="field"><span class="demo-icon" data-icon="password" aria-hidden="true"></span><input id="pw" type="password" placeholder="Password" aria-label="Password"><button class="eye" type="button" id="toggle" aria-label="Show password"><span class="demo-icon" data-icon="show" aria-hidden="true"></span></button></div><a href="#" class="forgot">Forgot password?</a><button class="primary">Log In <span class="arrow" aria-hidden="true"><span class="demo-icon" data-icon="forward"></span></span></button></form><div class="or">OR</div><div class="providers"><button type="button"><img src="./login-icons/providers/apple.svg" alt="">Continue with Apple</button><button type="button"><img src="./login-icons/providers/google.svg" alt="">Continue with Google</button></div><footer>Don’t have an account? <a href="#">Sign Up</a></footer><p class="note" id="note" role="status"></p></main><script>function setIcons(){const visible=document.getElementById('pw').type==='text';document.querySelectorAll('[data-icon]').forEach(el=>{const role=el.dataset.icon==='show'&&visible?'hide':el.dataset.icon;el.style.setProperty('--icon',`url("./login-icons/lucide/${role}.svg")`)}); }setIcons();document.getElementById('toggle').onclick=function(){const p=document.getElementById('pw');p.type=p.type==='password'?'text':'password';this.setAttribute('aria-label',p.type==='password'?'Show password':'Hide password');setIcons()};const notify=()=>document.getElementById('note').textContent='Design preview only — no account action was taken.';document.getElementById('login').onsubmit=e=>{e.preventDefault();notify()};document.querySelectorAll('a,.providers button').forEach(x=>x.onclick=e=>{e.preventDefault();notify()});</script></html>
