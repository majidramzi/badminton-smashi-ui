<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Smashi Login — design draft</title><style>
@font-face{font-family:Montserrat;src:url('../assets/fonts/Montserrat/Montserrat-VariableFont_wght.ttf');font-weight:100 900}@font-face{font-family:Montserrat;src:url('../assets/fonts/Montserrat/Montserrat-Italic-VariableFont_wght.ttf');font-weight:100 900;font-style:italic}*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;color:#f7faf9;font:500 1rem/1.5 Montserrat,sans-serif;background:radial-gradient(ellipse at 24% 0%,#066b6e 0%,transparent 54%),#0c2747}.bands{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}main{position:relative;width:min(100%,480px);padding:clamp(24px,6vh,72px) 20px;text-align:center}header img{display:block;width:clamp(88px,19vh,144px);margin:auto}h1{margin:0;font-size:clamp(2.5rem,7vw,3.5rem);line-height:1.1;font-style:italic;font-weight:800}.tag{margin:10px 0 clamp(28px,6vh,52px);font-size:.75rem;letter-spacing:.22em}.tag b,a{color:#8fe9d1}form{display:grid;gap:12px}.field{display:flex;align-items:center;gap:12px;background:#066b6e38;border:1px solid #f7faf980;border-radius:14px;padding:0 16px;min-height:56px;text-align:left}.field svg{width:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6}input,button{font:inherit;color:inherit}input{width:100%;min-width:0;background:none;border:0;padding:12px 0;outline:none}input::placeholder{color:#f7faf9bf}:focus-visible{outline:2px solid #8fe9d1;outline-offset:2px}.field input:focus-visible{outline:none}.field:focus-within{border-color:#f7faf9c2}button{cursor:pointer}button.eye{background:none;border:0;min-width:44px;min-height:44px;display:grid;place-items:center;padding:0}.forgot{justify-self:end}a{font-size:.875rem;font-weight:600;display:inline-flex;align-items:center;min-height:44px;text-decoration:none;cursor:pointer;transition:color .18s ease,text-shadow .18s ease}@media(hover:hover) and (pointer:fine){a:hover{color:#f7faf9;text-shadow:0 0 9px #8fe9d159}}@media(prefers-reduced-motion:reduce){a{transition:none}}.primary{min-height:56px;background:linear-gradient(90deg,#14b8a6,#8fe9d1);color:#0c2747;border:0;border-radius:999px;font-weight:700;position:relative;padding:10px 44px;overflow:hidden;isolation:isolate}.primary::before,.providers button::before{content:"";position:absolute;inset:-42% auto -42% -48%;width:42%;border-radius:50%;background:radial-gradient(ellipse at center,#f7faf966,transparent 72%);transform:skewX(-22deg);pointer-events:none;z-index:-1}@media(hover:hover) and (pointer:fine) and (prefers-reduced-motion:no-preference){.primary:not(:disabled):hover::before,.providers button:not(:disabled):hover::before{animation:login-sheen .85s ease-out both}}@keyframes login-sheen{0%{left:-48%;opacity:0}24%{opacity:1}78%{opacity:.8}100%{left:112%;opacity:0}}.arrow{position:absolute;right:16px}.or{display:flex;align-items:center;gap:16px;margin:22px 0;font-size:.875rem}.or:before,.or:after{content:'';height:1px;background:#f7faf980;flex:1}.providers{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.providers button{min-height:52px;border:1px solid #f7faf9a0;background:#0c274750;border-radius:999px;padding:8px 16px;font-size:.875rem;font-weight:600}footer{margin-top:16px;font-size:.875rem}@media(max-width:410px){.providers{grid-template-columns:1fr}}.note{font-size:.875rem;color:#8fe9d1;margin:0}
.demo-icon{display:inline-block;vertical-align:middle;width:20px;height:20px;flex:none;background:currentColor;mask:var(--icon) center/contain no-repeat}.providers button{position:relative;overflow:hidden;isolation:isolate;display:flex;align-items:center;justify-content:center;gap:8px}.providers button::before{background:radial-gradient(ellipse at center,#f7faf92e,transparent 72%)}.providers img{width:20px;height:20px;flex:none}
</style><svg class="bands" viewBox="0 0 400 800" preserveAspectRatio="none" aria-hidden="true"><path fill="#14B8A6" opacity=".19" d="M0 0H190C98 39 44 99 0 183Z"/><path fill="#066B6E" opacity=".38" d="M400 316V575C289 654 158 737 0 798C137 711 277 476 400 316Z"/><path fill="#14B8A6" opacity=".25" d="M400 600V800H40C228 774 314 700 400 600Z"/></svg><main><header><img src="../assets/brand/owner-reference/Smashi-logo.png" alt=""><h1>Smashi</h1><p class="tag">PLAY <b>•</b> CONNECT <b>•</b> GROW</p></header><form id="login"><label class="field"><span class="demo-icon" data-icon="email" aria-hidden="true"></span><input type="email" placeholder="Email" aria-label="Email"></label><div class="field"><span class="demo-icon" data-icon="password" aria-hidden="true"></span><input id="pw" type="password" placeholder="Password" aria-label="Password"><button class="eye" type="button" id="toggle" aria-label="Show password"><span class="demo-icon" data-icon="show" aria-hidden="true"></span></button></div><a href="#" class="forgot">Forgot password?</a><button class="primary">Log In <span class="arrow" aria-hidden="true"><span class="demo-icon" data-icon="forward"></span></span></button></form><div class="or">OR</div><div class="providers"><button type="button"><img src="./login-icons/providers/apple.svg" alt="">Continue with Apple</button><button type="button"><img src="./login-icons/providers/google.svg" alt="">Continue with Google</button></div><footer>Don’t have an account? <a href="#">Sign Up</a></footer><p class="note" id="note" role="status"></p></main><script>function setIcons(){const visible=document.getElementById('pw').type==='text';document.querySelectorAll('[data-icon]').forEach(el=>{const role=el.dataset.icon==='show'&&visible?'hide':el.dataset.icon;el.style.setProperty('--icon',`url("./login-icons/lucide/${role}.svg")`)}); }setIcons();document.getElementById('toggle').onclick=function(){const p=document.getElementById('pw');p.type=p.type==='password'?'text':'password';this.setAttribute('aria-label',p.type==='password'?'Show password':'Hide password');setIcons()};const notify=()=>document.getElementById('note').textContent='Design preview only — no account action was taken.';document.getElementById('login').onsubmit=e=>{e.preventDefault();notify()};document.querySelectorAll('a,.providers button').forEach(x=>x.onclick=e=>{e.preventDefault();notify()});</script></html>
